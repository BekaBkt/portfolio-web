<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f1d" />
      <stop offset="100%" stop-color="#05060b" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Code Glyph Gradient -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Inner Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Glyphs -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Base with Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  
  <!-- Ambient Center Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#glow)" />

  <!-- Subtle High-Tech Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#border)" stroke-width="1.75" />

  <!-- Code Symbol: </> -->
  <g filter="url(#shadow)" stroke="url(#codeGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Bracket < -->
    <path d="M 23 20 L 13 32 L 23 44" />
    
    <!-- Slash / -->
    <path d="M 37 17 L 27 47" />
    
    <!-- Right Bracket > -->
    <path d="M 41 20 L 51 32 L 41 44" />
  </g>
</svg>